spring.application.name=order-service
spring.config.import=optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
server.port=8087
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized
management.endpoint.health.probes.enabled=true

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

spring.cloud.openfeign.client.config.crop-service.connectTimeout=2000
spring.cloud.openfeign.client.config.crop-service.readTimeout=5000

spring.datasource.url=jdbc:mysql://localhost:3306/cropdeal_order
spring.datasource.username=${DB_USERNAME:Nilay}
spring.datasource.password=${DB_PASSWORD:Nilay}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=1000ms
spring.rabbitmq.listener.simple.retry.multiplier=2

security.jwt.secret=${JWT_SECRET:CropDealSuperSecretKeyForJWT2026ChangeMe}
