spring.application.name=notification-service
spring.config.import=optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
server.port=8089
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized
management.endpoint.health.probes.enabled=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
spring.datasource.url=jdbc:mysql://localhost:3306/cropdeal_notification
spring.datasource.username=${DB_USERNAME:Nilay}
spring.datasource.password=${DB_PASSWORD:Nilay}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=1000ms
spring.rabbitmq.listener.simple.retry.multiplier=2
security.jwt.secret=${JWT_SECRET:CropDealSuperSecretKeyForJWT2026ChangeMe}
notification.email.enabled=${NOTIFICATION_EMAIL_ENABLED:true}
notification.email.from=${NOTIFICATION_EMAIL_FROM:nilayrathod1303@gmail.com}
notification.internal-token=${NOTIFICATION_INTERNAL_TOKEN:CropDealNotificationInternal2026}
profile-service.url=${PROFILE_SERVICE_URL:http://localhost:8085}
subscription-service.url=${SUBSCRIPTION_SERVICE_URL:http://localhost:8090}
subscription.internal-token=${SUBSCRIPTION_INTERNAL_TOKEN:CropDealSubscriptionInternal2026}
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true