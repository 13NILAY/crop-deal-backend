spring.application.name=crop-service
 
server.port=8082
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized
management.endpoint.health.probes.enabled=true
 
spring.datasource.url=jdbc:mysql://localhost:3306/cropdeal_crop_db
spring.datasource.username=Nilay
spring.datasource.password=Nilay
 
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
 
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
security.jwt.secret=${JWT_SECRET:CropDealSuperSecretKeyForJWT2026ChangeMe}
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}