spring.application.name=profile-service
server.port=8085
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized
management.endpoint.health.probes.enabled=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
spring.datasource.url=jdbc:mysql://localhost:3306/cropdeal_profile
spring.datasource.username=${DB_USERNAME:Nilay}
spring.datasource.password=${DB_PASSWORD:Nilay}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
security.jwt.secret=${JWT_SECRET:CropDealSuperSecretKeyForJWT2026ChangeMe}
notification.internal-token=${NOTIFICATION_INTERNAL_TOKEN:CropDealNotificationInternal2026}
